<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emma Hud Space</title>
<style>
:root{--bg:#f3f5fa;--panel:#fff;--text:#182033;--muted:#7c8497;--accent:#6c63ff;--soft:#eef0ff;--border:#e5e8ef;--danger:#e5484d}
.dark{--bg:#0f121a;--panel:#181c25;--text:#f5f7fb;--muted:#9aa2b3;--soft:#292e3d;--border:#2a3040}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}.hidden{display:none!important}.app{height:100vh;display:grid;grid-template-columns:320px 1fr;max-width:1400px;margin:auto;background:var(--panel);overflow:hidden}
.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column}.brand{padding:20px;font-size:22px;font-weight:850}.brand b{color:var(--accent)}
.me{display:flex;align-items:center;gap:12px;padding:4px 18px 16px}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#ff9a9e,#fad0c4);display:grid;place-items:center;color:#fff;font-weight:800}.me .avatar{cursor:pointer}
.search{margin:0 16px 14px;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);outline:none}.chats{overflow:auto}.chat{display:flex;gap:11px;padding:13px 17px;cursor:pointer}.chat:hover,.chat.active{background:var(--bg)}.chatinfo{min-width:0;flex:1}.row{display:flex;justify-content:space-between}.name{font-weight:700}.time,.preview,.status{font-size:12px;color:var(--muted)}.preview{margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{display:flex;flex-direction:column;min-width:0}.topbar{height:72px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 20px}.person{display:flex;align-items:center;gap:11px}.person .avatar{width:42px;height:42px}.actions{display:flex;gap:7px}.icon{border:0;background:var(--bg);color:var(--text);width:40px;height:40px;border-radius:12px;cursor:pointer}
.messages{flex:1;overflow:auto;padding:24px;background:radial-gradient(circle at top right,rgba(108,99,255,.1),transparent 35%),var(--bg);display:flex;flex-direction:column;gap:10px}.day{text-align:center;color:var(--muted);font-size:12px;margin:3px}.bubble{max-width:72%;padding:10px 13px;border-radius:16px;background:var(--panel);border:1px solid var(--border);line-height:1.35}.bubble.me{align-self:flex-end;background:var(--accent);color:white;border:0;border-bottom-right-radius:5px}.bubble.them{align-self:flex-start;border-bottom-left-radius:5px}.bubble small{display:block;font-size:10px;opacity:.65;text-align:right;margin-top:4px}.bubble img{max-width:280px;border-radius:12px;display:block}.composer{border-top:1px solid var(--border);padding:12px;display:flex;gap:7px;align-items:center;position:relative}.composer input[type=text]{flex:1;min-width:0;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:14px;padding:12px 14px;outline:none}.send{border:0;background:var(--accent);color:white;border-radius:13px;padding:12px 17px;font-weight:700;cursor:pointer}.stickers{display:none;position:absolute;bottom:65px;left:10px;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:10px;box-shadow:0 14px 40px #0002;width:230px}.stickers.open{display:grid;grid-template-columns:repeat(5,1fr)}.stickers button{border:0;background:transparent;font-size:25px;padding:7px;cursor:pointer}.recording{background:var(--danger)!important}.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:10}.card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:0 20px 60px #0001}.card h1{margin:0 0 8px}.card p{color:var(--muted)}.card input{width:100%;margin:7px 0;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)}.card button{width:100%;margin-top:8px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:white;font-weight:700}.switch{background:transparent!important;color:var(--accent)!important}.onlineDot{width:10px;height:10px;background:#32d583;border-radius:50%;display:inline-block;margin-left:5px}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.messages{padding:15px}.bubble{max-width:88%}}
</style>
</head>
<body>
<div id="login" class="login">
 <div class="card">
  <h1>Emma <span style="color:#6c63ff">Hud Space</span></h1>
  <p id="authTitle">Sign in to your space</p>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="authBtn" onclick="auth()">Sign in</button>
  <button class="switch" onclick="toggleAuth()">Create an account</button>
  <p id="authMsg"></p>
 </div>
</div>
<div class="app">
 <aside class="sidebar">
  <div class="brand">Emma <b>Hud Space</b></div>
  <div class="me"><img id="myAvatar" class="avatar" alt="Profile"><div><b id="myName">You</b><div class="status">Your profile</div></div></div>
  <input id="search" class="search" placeholder="Search people..." oninput="renderUsers()">
  <div id="users" class="chats"></div>
 </aside>
 <main class="main">
  <header class="topbar">
   <div class="person"><img id="theirAvatar" class="avatar" alt=""><div><b id="theirName">Select a chat</b><div id="theirStatus" class="status">—</div></div></div>
   <div class="actions"><button class="icon" onclick="toggleTheme()">☾</button><button class="icon" onclick="signOut()">↪</button></div>
  </header>
  <section id="messages" class="messages"><div class="day">Select someone to start chatting</div></section>
  <footer class="composer">
   <div id="stickers" class="stickers"></div>
   <button class="icon" onclick="toggleStickers()">😊</button>
   <label class="icon" title="Send picture">📷<input id="photo" hidden type="file" accept="image/*" onchange="sendPhoto(this)"></label>
   <button id="voiceBtn" class="icon" onclick="toggleVoice()">🎙</button>
   <input id="text" type="text" placeholder="Message..." onkeydown="if(event.key==='Enter')sendText()">
   <button class="send" onclick="sendText()">Send</button>
  </footer>
 </main>
</div>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* Put your Supabase project values in config.js. */
import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./config.js";
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let me=null, selected=null, channel=null, recording=null, chunks=[], signup=false;
const $=id=>document.getElementById(id);
const stickers=['😂','😍','🔥','🥹','❤️','✨','😭','🤣','👏','💯','🎉','😎','😘','🤝','🙌'];
$('stickers').innerHTML=stickers.map(x=>`<button onclick="window.sendSticker('${x}')">${x}</button>`).join('');

window.toggleAuth=()=>{signup=!signup;$('authTitle').textContent=signup?'Create your account':'Sign in to your space';$('authBtn').textContent=signup?'Create account':'Sign in';document.querySelector('.switch').textContent=signup?'I already have an account':'Create an account'};
window.auth=async()=>{
 $('authMsg').textContent='';
 const email=$('email').value.trim(), password=$('password').value;
 if(!email||!password)return $('authMsg').textContent='Enter your email and password.';
 const r=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});
 if(r.error)return $('authMsg').textContent=r.error.message;
 if(signup&&!r.data.session)$('authMsg').textContent='Account created. Check your email if confirmation is enabled.';
};
window.signOut=()=>sb.auth.signOut();
window.toggleTheme=()=>{document.body.classList.toggle('dark');localStorage.hudTheme=document.body.classList.contains('dark')?'dark':'light'};
if(localStorage.hudTheme==='dark')document.body.classList.add('dark');
window.toggleStickers=()=>$('stickers').classList.toggle('open');

function initials(email){return (email||'U').slice(0,1).toUpperCase()}
function avatarUrl(u){return u.avatar_url||`https://ui-avatars.com/api/?name=${encodeURIComponent(u.display_name||u.email||'User')}&background=6c63ff&color=fff`}
async function init(){
 const {data:{session}}=await sb.auth.getSession(); if(!session)return;
 me=session.user;
 $('login').classList.add('hidden');
 await ensureProfile(); await renderUsers(); listenPresence(); setOnline(true);
}
async function ensureProfile(){
 const {data:p}=await sb.from('profiles').select('*').eq('id',me.id).maybeSingle();
 if(!p){await sb.from('profiles').insert({id:me.id,email:me.email,display_name:me.email.split('@')[0]})}
 const {data:x}=await sb.from('profiles').select('*').eq('id',me.id).single();
 $('myName').textContent=x.display_name;$('myAvatar').src=avatarUrl(x);
}
async function renderUsers(){
 const q=$('search').value.trim(); let query=sb.from('profiles').select('*').neq('id',me.id).order('display_name');
 if(q)query=query.ilike('display_name',`%${q}%`);
 const {data,error}=await query.limit(50); if(error)return;
 $('users').innerHTML=(data||[]).map(u=>`<div class="chat ${selected?.id===u.id?'active':''}" onclick="window.openChat('${u.id}')">
 <img class="avatar" src="${avatarUrl(u)}"><div class="chatinfo"><div class="row"><span class="name">${esc(u.display_name||u.email)}</span><span class="time">${u.is_online?'●':''}</span></div><div class="preview">${u.is_online?'Online':'Offline'}</div></div></div>`).join('');
}
window.openChat=async id=>{
 const {data}=await sb.from('profiles').select('*').eq('id',id).single(); if(!data)return;
 selected=data;$('theirName').textContent=data.display_name||data.email;$('theirAvatar').src=avatarUrl(data);$('theirStatus').innerHTML=data.is_online?'Online <span class="onlineDot"></span>':'Offline';
 $('messages').innerHTML=''; await loadMessages(); subscribeMessages(); renderUsers();
};
async function loadMessages(){
 if(!selected)return; const {data}=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${selected.id}),and(sender_id.eq.${selected.id},receiver_id.eq.${me.id})`).order('created_at');
 (data||[]).forEach(renderMessage);
 $('messages').scrollTop=$('messages').scrollHeight;
}
function renderMessage(m){const d=document.createElement('div');d.className='bubble '+(m.sender_id===me.id?'me':'them');if(m.type==='image')d.innerHTML=`<img src="${esc(m.content)}"><small>${time(m.created_at)}</small>`;else if(m.type==='sticker')d.innerHTML=`<span style="font-size:56px">${esc(m.content)}</span><small>${time(m.created_at)}</small>`;else if(m.type==='voice')d.innerHTML=`<audio controls src="${esc(m.content)}"></audio><small>${time(m.created_at)}</small>`;else d.innerHTML=`${esc(m.content)}<small>${time(m.created_at)}</small>`;$('messages').appendChild(d)}
function time(t){return new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function send(content,type='text'){if(!selected||!content)return;const {error}=await sb.from('messages').insert({sender_id:me.id,receiver_id:selected.id,content,type});if(error)alert(error.message)}
window.sendText=()=>{const x=$('text');const v=x.value.trim();if(v){send(v);x.value=''}};
window.sendSticker=x=>{toggleStickers();send(x,'sticker')};
window.sendPhoto=async input=>{const f=input.files[0];if(!f||!selected)return;const ext=f.name.split('.').pop();const path=`${me.id}/${crypto.randomUUID()}.${ext}`;const up=await sb.storage.from('chat-media').upload(path,f);if(up.error)return alert(up.error.message);const {data}=sb.storage.from('chat-media').getPublicUrl(path);await send(data.publicUrl,'image');input.value=''};
async function toggleVoice(){
 if(recording){recording.stop();return}
 if(!navigator.mediaDevices?.getUserMedia)return alert('Voice recording is not supported here.');
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recording=new MediaRecorder(stream);
 recording.ondataavailable=e=>chunks.push(e.data);recording.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('voiceBtn').classList.remove('recording');const blob=new Blob(chunks,{type:'audio/webm'});const path=`${me.id}/${crypto.randomUUID()}.webm`;const up=await sb.storage.from('chat-media').upload(path,blob,{contentType:'audio/webm'});if(up.error)return alert(up.error.message);const {data}=sb.storage.from('chat-media').getPublicUrl(path);await send(data.publicUrl,'voice');recording=null};
 recording.start();$('voiceBtn').classList.add('recording');
}
function subscribeMessages(){if(channel)sb.removeChannel(channel);channel=sb.channel('messages-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},p=>{const m=p.new;if(selected&&((m.sender_id===me.id&&m.receiver_id===selected.id)||(m.sender_id===selected.id&&m.receiver_id===me.id))){renderMessage(m);$('messages').scrollTop=$('messages').scrollHeight}}).subscribe()}
function listenPresence(){sb.channel('presence').on('presence', {event:'sync'},()=>{}).subscribe()}
async function setOnline(v){await sb.from('profiles').update({is_online:v,last_seen:new Date().toISOString()}).eq('id',me.id)}
window.addEventListener('beforeunload',()=>setOnline(false));
sb.auth.onAuthStateChange(()=>setTimeout(init,0));
init();
</script>
</body>
</html>
